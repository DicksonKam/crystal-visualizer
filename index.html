<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Structure Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=22">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <svg viewBox="0 0 32 32" class="logo-icon">
                    <defs>
                        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#00f5d4;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#7b2cbf;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <circle cx="16" cy="16" r="6" fill="url(#grad1)"/>
                    <circle cx="8" cy="8" r="3" fill="#00f5d4" opacity="0.8"/>
                    <circle cx="24" cy="8" r="3" fill="#9b5de5" opacity="0.8"/>
                    <circle cx="8" cy="24" r="3" fill="#f15bb5" opacity="0.8"/>
                    <circle cx="24" cy="24" r="3" fill="#fee440" opacity="0.8"/>
                    <line x1="8" y1="8" x2="16" y2="16" stroke="#00f5d4" stroke-width="1" opacity="0.5"/>
                    <line x1="24" y1="8" x2="16" y2="16" stroke="#9b5de5" stroke-width="1" opacity="0.5"/>
                    <line x1="8" y1="24" x2="16" y2="16" stroke="#f15bb5" stroke-width="1" opacity="0.5"/>
                    <line x1="24" y1="24" x2="16" y2="16" stroke="#fee440" stroke-width="1" opacity="0.5"/>
                </svg>
                <span class="logo-text">Crystal Visualizer</span>
            </div>
            <div class="header-controls">
                <!-- Mode Toggle -->
                <div class="mode-toggle" id="modeToggle">
                    <button class="mode-btn active" data-mode="measure" title="Measure Mode">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M21 6H3a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1zM6 8H4V7h2v1zm4 0H8V7h2v1zm4 0h-2V7h2v1zm4 0h-2V7h2v1zm2 0h-1V7h1v1z"/>
                            <path d="M3 14h18v2H3zM3 18h18v2H3z" opacity="0.5"/>
                        </svg>
                        <span>Measure</span>
                    </button>
                    <button class="mode-btn" data-mode="edit" title="Edit Mode">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 0 0 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                        </svg>
                        <span>Edit</span>
                    </button>
                </div>
                
                <div class="header-separator"></div>
                
                <button id="resetView" class="btn btn-secondary" title="Reset View">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                    </svg>
                </button>
                <button id="toggleAxes" class="btn btn-secondary active" title="Toggle Axes">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
                    </svg>
                </button>
                <button id="toggleCell" class="btn btn-secondary active" title="Toggle Unit Cell">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 3h18v18H3z"/>
                    </svg>
                </button>
                
                <div class="header-separator"></div>
                
                <button id="exportPoscar" class="btn btn-export" title="Export as POSCAR">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <span>Export</span>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="panel structure-info">
                    <h3 class="panel-title">Structure Info</h3>
                    <div id="structureInfo" class="info-content">
                        <p class="placeholder-text">Drop a POSCAR file to view structure information</p>
                    </div>
                </div>
                
                <div class="panel atom-list">
                    <h3 class="panel-title">Atoms</h3>
                    <div id="atomList" class="atom-list-content">
                        <p class="placeholder-text">No atoms loaded</p>
                    </div>
                </div>

                <div class="panel measurement-panel">
                    <h3 class="panel-title" id="actionPanelTitle">📐 Measurements</h3>
                    <div id="measurementPanel" class="measurement-content">
                        <p class="placeholder-text">Click atoms to measure</p>
                    </div>
                </div>

                <div class="panel controls-panel">
                    <h3 class="panel-title">Display Options</h3>
                    <div class="control-group">
                        <label for="atomScale">Atom Size</label>
                        <input type="range" id="atomScale" min="0.1" max="2" step="0.1" value="0.8">
                    </div>
                    <div class="control-group">
                        <label for="bondThreshold">Bond Length (Å)</label>
                        <input type="range" id="bondThreshold" min="0.5" max="4" step="0.1" value="2.5">
                        <span id="bondThresholdValue" class="value-display">2.5</span>
                    </div>
                    <div class="control-group checkbox-group">
                        <label>
                            <input type="checkbox" id="showBonds" checked>
                            <span>Show Bonds</span>
                        </label>
                    </div>
                    <div class="control-group checkbox-group">
                        <label>
                            <input type="checkbox" id="showLabels">
                            <span>Show Labels</span>
                        </label>
                    </div>
                    <div class="control-group checkbox-group">
                        <label>
                            <input type="checkbox" id="showFixedIndicators" checked>
                            <span>Show Fixed Atoms</span>
                        </label>
                    </div>
                    
                    <!-- Periodic Images Section -->
                    <div class="control-divider"></div>
                    <div class="control-group periodic-group">
                        <label>Periodic Images</label>
                        <div class="periodic-row">
                            <div class="periodic-axis">
                                <span class="axis-badge axis-a">a</span>
                                <div class="stepper">
                                    <button type="button" class="stepper-btn" data-axis="a" data-dir="minus">−</button>
                                    <span id="periodicADisplay" class="stepper-value">1</span>
                                    <button type="button" class="stepper-btn" data-axis="a" data-dir="plus">+</button>
                                </div>
                                <input type="hidden" id="periodicA" value="1">
                            </div>
                            <div class="periodic-axis">
                                <span class="axis-badge axis-b">b</span>
                                <div class="stepper">
                                    <button type="button" class="stepper-btn" data-axis="b" data-dir="minus">−</button>
                                    <span id="periodicBDisplay" class="stepper-value">1</span>
                                    <button type="button" class="stepper-btn" data-axis="b" data-dir="plus">+</button>
                                </div>
                                <input type="hidden" id="periodicB" value="1">
                            </div>
                            <div class="periodic-axis">
                                <span class="axis-badge axis-c">c</span>
                                <div class="stepper">
                                    <button type="button" class="stepper-btn" data-axis="c" data-dir="minus">−</button>
                                    <span id="periodicCDisplay" class="stepper-value">1</span>
                                    <button type="button" class="stepper-btn" data-axis="c" data-dir="plus">+</button>
                                </div>
                                <input type="hidden" id="periodicC" value="1">
                            </div>
                        </div>
                    </div>
                    
                    <!-- Edit Mode Only: Supercell & Vacuum Controls -->
                    <div id="editModeControls" class="edit-mode-only" style="display: none;">
                        <div class="control-divider"></div>
                        <div class="control-group supercell-group">
                            <button type="button" id="makeSupercellBtn" class="btn btn-supercell" disabled title="Set periodicity > 1×1×1 first">
                                <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <rect x="2" y="2" width="6" height="6" rx="1"/>
                                    <rect x="12" y="2" width="6" height="6" rx="1"/>
                                    <rect x="2" y="12" width="6" height="6" rx="1"/>
                                    <rect x="12" y="12" width="6" height="6" rx="1"/>
                                </svg>
                                Make Supercell
                            </button>
                        </div>
                        <div class="control-group vacuum-info" id="vacuumInfo">
                            <p class="vacuum-hint">
                                <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 12.5a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5zm.75-3.25a.75.75 0 0 1-1.5 0V5.5a.75.75 0 0 1 1.5 0v4.75z"/></svg>
                                Align to ±a/b/c axis to drag cell faces
                            </p>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- 3D Viewport -->
            <div class="viewport-container">
                <!-- File input OUTSIDE the drop zone, at document level -->
                <input type="file" id="fileInput" style="display: none;">
                
                <label for="fileInput" id="dropZone" class="drop-zone">
                    <div class="drop-zone-content">
                        <svg class="drop-icon" viewBox="0 0 64 64" fill="none">
                            <circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="2" stroke-dasharray="8 4"/>
                            <path d="M32 20v24M20 32h24" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                        </svg>
                        <p class="drop-text">Drop POSCAR file here</p>
                        <p class="drop-subtext">or click to browse</p>
                    </div>
                </label>
                <div id="viewport" class="viewport"></div>
                <div class="viewport-overlay">
                    <div class="controls-hint">
                        <span>🖱️ Drag: Rotate</span>
                        <span>Right Drag: Pan</span>
                        <span>Scroll: Zoom</span>
                    </div>
                </div>
            </div>
        </main>

        <!-- Status Bar -->
        <footer class="status-bar">
            <div class="status-left">
                <span id="statusText">Ready</span>
            </div>
            <div class="status-right">
                <span id="coordInfo">X: - Y: - Z: -</span>
            </div>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>
    <script src="app.js?v=90"></script>
</body>
</html>
